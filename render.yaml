services:
  - type: web
    name: expense-tracker-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: DATABASE_URL
        sync: false
      - key: DEFAULT_TIMEZONE
        value: Asia/Kolkata
      - key: ALLOWED_TELEGRAM_USER_ID
        sync: false
      - key: RENDER_SERVICE_URL
        sync: false
